<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvilRoyStudio</title>
<meta name="description" content="EvilRoyStudio — art toy maker and traditional sculptor.">
<link rel="icon" type="image/png" href="app-icon.png">
<style>
  :root { --bg: #faf9f6; --text: #1d1c1a; --muted: #67645e; --border: #e4e1da; --accent: #b3122b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --text: #f0eee8; --muted: #a39f97; --border: #33312d; --accent: #ff6b7d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 16px 80px; text-align: center; }
  img { width: 120px; height: 120px; border-radius: 28px; }
  h1 { font-size: 34px; margin: 20px 0 4px; letter-spacing: -0.01em; }
  .tag { color: var(--muted); margin: 0 0 28px; }
  p { margin: 0 0 16px; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 28px; }
  .links a { color: var(--accent); text-decoration: none; border: 1px solid var(--border); padding: 8px 16px; border-radius: 999px; }
  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img src="app-icon.png" alt="EvilRoyStudio logo">
  <h1>EvilRoyStudio</h1>
  <p class="tag">Art Toy Maker · Traditional Sculptor</p>
  <p>Original art toys, sculptures and sculpting courses — plus the tools and supplies we actually use in the studio.</p>
  <div class="links">
    <a href="https://www.pinterest.com/evilroystudio/" target="_blank" rel="noopener">Pinterest</a>
    <a href="https://cristopherdinoart.myshopify.com" target="_blank" rel="noopener">Shop</a>
  </div>
  <footer>
    © 2026 EvilRoyStudio · <a href="privacy.html">Privacy Policy</a><br>
    As an Amazon Associate, EvilRoyStudio earns from qualifying purchases.
  </footer>
</main>
</body>
</html>
